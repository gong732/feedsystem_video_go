<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d10">
<title>VideoFeed · Go 视频流</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<header class="topbar">
  <a class="logo" href="/" aria-label="VideoFeed 首页">
    <span class="logo-mark">▶</span>
    <span class="logo-text">Video<b>Feed</b></span>
  </a>
  <nav class="nav" aria-label="主导航">
    <button data-view="discover" class="active" type="button">发现</button>
    <button data-view="hot" type="button">热榜</button>
    <button data-view="feed" id="nav-feed" type="button">关注流</button>
    <button data-view="publish" id="nav-publish" type="button">发布</button>
  </nav>
  <div class="spacer"></div>
  <div class="userbox" id="userbox"></div>
</header>

<main class="main" id="main"></main>

<!-- 登录 / 注册 -->
<div class="detail-wrap" id="auth-modal" style="display:none;">
  <div class="auth-card" role="dialog" aria-modal="true" aria-labelledby="auth-title">
    <div class="auth-head">
      <div class="auth-eyebrow">VIDEOFEED</div>
      <div class="view-title" id="auth-title">登录</div>
    </div>
    <div class="field"><label for="auth-username">用户名</label><input id="auth-username" placeholder="输入用户名" autocomplete="username"></div>
    <div class="field"><label for="auth-password">密码</label><input id="auth-password" type="password" placeholder="输入密码" autocomplete="current-password"></div>
    <div class="field" id="nickname-field" style="display:none;"><label for="auth-nickname">昵称（可选）</label><input id="auth-nickname" placeholder="展示昵称"></div>
    <div class="form-msg" id="auth-msg"></div>
    <button class="btn btn-primary btn-block" id="auth-submit" type="button">登录</button>
    <div class="switch-link" id="auth-switch">没有账号？<a id="auth-switch-link">去注册</a></div>
  </div>
</div>

<!-- 视频详情：桌面双栏 -->
<div class="detail-wrap" id="detail-modal" style="display:none;">
  <div class="detail-card" role="dialog" aria-modal="true">
    <button class="detail-close" id="detail-close" type="button" aria-label="关闭">✕</button>
    <div class="detail-left">
      <div class="detail-player" id="detail-player"></div>
    </div>
    <div class="detail-right" id="detail-body"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/static/app.js" defer></script>
</body>
</html>
